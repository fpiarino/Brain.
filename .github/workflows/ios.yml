# Compila Brain su un Mac di GitHub, esegue tutti i test e prepara il file .ipa
# da installare sull'iPhone con Sideloadly (firmato poi con il tuo Apple ID).
name: Build e test iOS

on:
  push:
    branches-ignore:
      - ci-logs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build e test (simulatore)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Usa la versione di Xcode più recente installata
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Xcode scelto: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Scegli un simulatore iPhone
        id: sim
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ios = [(rt, d) for rt, ds in data.items() if "iOS" in rt for d in ds if d["name"].startswith("iPhone")]
          ios.sort(key=lambda x: x[0])
          print(ios[-1][1]["udid"])
          ')
          echo "Simulatore: $DEVICE_ID"
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Compila e testa
        env:
          # Il simulatore sui server di GitHub è molto più lento di un Mac:
          # per il test "crea e segna" il limite sale da 30 a 90 secondi.
          TEST_RUNNER_BRAIN_UI_TIME_LIMIT: "90"
        run: |
          set -o pipefail
          xcodebuild test \
            -project Brain.xcodeproj \
            -scheme Brain \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-test.log

      - name: Riepilogo errori
        if: failure()
        run: |
          grep -E "error:|warning: .*(deprecated|will be an error)|Test Case .* failed|XCTAssert" xcodebuild-test.log | head -200 || true

      - name: Pubblica il log sul branch ci-logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-log.sh xcodebuild-test.log test

      - name: Salva log e risultati
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risultati-test
          path: |
            xcodebuild-test.log
            TestResults.xcresult
          if-no-files-found: ignore

  ipa:
    name: File .ipa per Sideloadly
    needs: build-and-test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Usa la versione di Xcode più recente installata
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"

      - name: Compila per iPhone senza firma
        run: |
          set -o pipefail
          xcodebuild build \
            -project Brain.xcodeproj \
            -scheme Brain \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee xcodebuild-ipa.log

      - name: Pubblica il log sul branch ci-logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-log.sh xcodebuild-ipa.log ipa

      - name: Crea Brain.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Brain.app Payload/
          zip -qry Brain.ipa Payload

      - name: Salva Brain.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Brain-ipa
          path: Brain.ipa

      # Link fisso, sempre aggiornato all'ultima versione che ha passato i test:
      # https://github.com/<utente>/<repo>/releases/latest/download/Brain.ipa
      - name: Pubblica Brain.ipa come ultima versione
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ultima --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create ultima Brain.ipa -R "$GITHUB_REPOSITORY" --latest \
            --title "Brain – ultima versione" \
            --notes "Compilata dal commit ${GITHUB_SHA::7} il $(date -u +%d/%m/%Y). Per installarla segui INSTALLA.md."
